<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TZ JAMII V3</title>
<style>
body{margin:0;font-family:sans-serif;background:#eef2f5}
header{background:#0a7a3a;color:#fff;padding:12px;text-align:center;font-weight:900;font-size:20px}
.tabs{display:flex;overflow-x:auto;background:#fff;gap:6px;padding:8px}
.tabs button{border:0;background:#eee;padding:8px 12px;border-radius:20px;font-weight:700;white-space:nowrap}
.tabs button.active{background:#0a7a3a;color:#fff}
.card{background:#fff;margin:10px;padding:12px;border-radius:12px}
input,select,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;font-size:16px}
.btn{background:#0a7a3a;color:#fff;border:0;padding:12px;width:100%;border-radius:10px;font-weight:900;font-size:16px}
.post{border-top:1px solid #eee;padding:10px 0}
.post img{max-width:100%;border-radius:10px}
.small{color:#666;font-size:13px}
</style></head><body>
<header>🇹🇿 TZ JAMII V3</header>
<div class="tabs" id="tabs"></div>

<div class="card" id="authCard">
<b>Karibu TZ JAMII</b>
<div id="userInfo"></div>
<div id="loginForm">
<input id="myName" placeholder="👤 Jina lako - mfano Fanuel Kisoma">
<input id="myPhone" placeholder="📞 Namba ya Simu - mfano 0628285096">
<input type="file" id="myPicFile" accept="image/*">
<img id="myPicPreview" style="display:none;width:70px;height:70px;border-radius:50%;object-fit:cover;margin-top:5px">
<p class="small">Chagua picha kutoka kwenye simu yako</p>
<input id="password" type="password" placeholder="🔒 Password">
<button class="btn" onclick="ingiaSasa()">INGIA / JIANDIKISHE</button>
<p id="loginMsg" class="small"></p>
</div>
<button class="btn" id="logoutBtn" style="display:none;background:#c00" onclick="doLogout()">TOKA</button>
<input id="searchInput" placeholder="🔍 Tafuta mtu / post...">
</div>

<div class="card" id="postCard" style="display:none">
<select id="postCat"></select>
<select id="postSub"></select>
<textarea id="postText" placeholder="Andika jambo..."></textarea>
<input id="postMedia" placeholder="Link ya Picha / YouTube">
<button class="btn" id="postBtn">POST</button>
</div>

<div class="card"><b>🏠 <span id="filterTitle">Nyumbani - Post zote</span></b>
<select id="subFilter"><option value="">- Zote -</option></select>
<div id="postList"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC_bMAM3_DGUi6EBOBsrPzPSUroY4jUubo",
  authDomain: "tzjamii.firebaseapp.com",
  projectId: "tzjamii",
  storageBucket: "tzjamii.firebasestorage.app",
  messagingSenderId: "210377984835",
  appId: "1:210377984835:web:cfc328a7c3e9e389f2fdf6",
  measurementId: "G-KZ5M48VLDJ"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const CATS = ["Michezo","Mikoa","Matangazo","Soko","Vipaji","Vyama","Klabu","Movies","Mziki","Mahusiano","Neno la MUNGU"];
const LISTS = {
  "Michezo":["Mpira wa Miguu","Mpira wa Kikapu","Riadha"],
  "Mikoa":["Dar es Salaam","Arusha","Dodoma","Mwanza"],
  "Matangazo":["Biashara","Ajira","Nyumba"],
  "Soko":["Nguo","Viatu","Simu","Chakula"],
  "Vipaji":["Kuumba","Kuigiza","Mpira"],
  "Vyama":["Vijana","Wanawake","Wafanyabiashara"],
  "Klabu":["Simba SC","Yanga SC","Azam FC"],
  "Movies":["Kichina","Kihindi","Kibongo"],
  "Mziki":["Bongo Flava","Gospel","Taarab"],
  "Mahusiano":["Urafiki","Uchumba","Ndoa"],
  "Neno la MUNGU":["Maombi","Somo","Wimbo"]
};
let currentCat="All", currentUser=null, myProfile={}, allPosts=[];

// TABS
let tabsHtml='<button class="active" onclick="setCat(\'All\',this)">🏠 Nyumbani</button>';
CATS.forEach(c=>{ tabsHtml+='<button onclick="setCat(\''+c+'\',this)">'+c+'</button>'; });
document.getElementById("tabs").innerHTML=tabsHtml;
let pcHtml=""; CATS.forEach(c=>pcHtml+='<option>'+c+'</option>');
document.getElementById("postCat").innerHTML=pcHtml;

window.setCat=(cat,btn)=>{
  currentCat=cat;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
  document.getElementById("filterTitle").innerText=(cat==="All"?"Nyumbani - Post zote":cat);
  let sf=document.getElementById("subFilter");
  if(cat==="All"){ sf.innerHTML='<option value="">- Zote -</option>'; }
  else { sf.innerHTML='<option value="">- Zote -</option>'+(LISTS[cat]||[]).map(x=>'<option>'+x+'</option>').join(""); }
  render();
};
window.updateSub=()=>{
  let cat=document.getElementById("postCat").value;
  document.getElementById("postSub").innerHTML=(LISTS[cat]||[]).map(x=>'<option>'+x+'</option>').join("");
};
window.updateSub();
document.getElementById("postCat").addEventListener("change",window.updateSub);

// LOGIN - hii ndiyo pekee
window.ingiaSasa=async()=>{
  document.getElementById("loginMsg").innerText="Najaribu...";
  const name=document.getElementById("myName").value.trim();
  const phone=document.getElementById("myPhone").value.trim();
  const pic=document.getElementById("myPic").value.trim();
  const p=document.getElementById("password").value;
  if(!name||!phone||!p){ alert("Jaza Jina, Namba na Password!"); return; }
  if(p.length<6){ alert("Password iwe angalau 6, mfano 123456"); return; }
  const fakeEmail=phone+"@tzjamii.com";
  try{
    await signInWithEmailAndPassword(auth,fakeEmail,p);
    alert("UMEFANIKIWA KUINGIA!");
  }catch(e){
    try{
      const cred=await createUserWithEmailAndPassword(auth,fakeEmail,p);
      await setDoc(doc(db,"users",cred.user.uid),{name:name,phone:phone,pic:pic,email:fakeEmail});
      alert("UMESAJILIWA! Karibu "+name);
    }catch(e2){ alert("KOSA LA FIREBASE: "+e2.message); return; }
  }
  location.reload();
};
window.doLogout=async()=>{ await signOut(auth); location.reload(); };

// AUTH STATE
onAuthStateChanged(auth,async(user)=>{
  if(user){
    currentUser=user;
    const snap=await getDoc(doc(db,"users",user.uid));
    myProfile=snap.exists()?snap.data():{};
    document.getElementById("loginForm").style.display="none";
    document.getElementById("logoutBtn").style.display="block";
    document.getElementById("postCard").style.display="block";
    document.getElementById("userInfo").innerHTML="Karibu <b>"+(myProfile.name||"")+"</b> 👋";
  }
});

// POST
document.getElementById("postBtn").onclick=async()=>{
  if(!currentUser){ alert("Ingia kwanza!"); return; }
  const text=document.getElementById("postText").value.trim();
  if(!text){ alert("Andika kitu kwanza!"); return; }
  await addDoc(collection(db,"posts"),{
    uid:currentUser.uid, name:myProfile.name||"Mtumiaji", pic:myProfile.pic||"",
    cat:document.getElementById("postCat").value,
    sub:document.getElementById("postSub").value||"",
    text:text, media:document.getElementById("postMedia").value.trim(),
    likes:[], createdAt:Date.now(), pinned:false
  });
  document.getElementById("postText").value="";
  alert("Post imetumwa!");
};

// LISTEN POSTS
const q=query(collection(db,"posts"),orderBy("createdAt","desc"));
onSnapshot(q,(snap)=>{
  allPosts=[]; snap.forEach(d=>{ allPosts.push({id:d.id,...d.data()}); });
  render();
},(err)=>{ document.getElementById("postList").innerHTML="KOSA KUSOMA POST: "+err.message; });

document.getElementById("searchInput").addEventListener("input",(e)=>render(e.target.value));
document.getElementById("subFilter").addEventListener("change",()=>render());

function render(search=""){
  const list=document.getElementById("postList");
  const subF=document.getElementById("subFilter").value;
  let filtered=allPosts.filter(p=> (currentCat==="All"||p.cat===currentCat) && (!subF||p.sub===subF) && (!search||(p.text||"").toLowerCase().includes(search.toLowerCase())||(p.name||"").toLowerCase().includes(search.toLowerCase())) );
  if(!filtered.length){ list.innerHTML="<p class='small'>Hakuna post bado. Kuwa wa kwanza kupost!</p>"; return; }
  list.innerHTML=filtered.map(p=>'<div class="post"><b>'+p.name+'</b> <span class="small">• '+p.cat+' '+(p.sub?"- "+p.sub:"")+'</span><br>'+p.text+(p.media?'<br><img src="'+p.media+'">':"")+'<br><button onclick="likePost(\''+p.id+'\')">❤️ '+(p.likes?p.likes.length:0)+'</button> '+(currentUser&&currentUser.uid===p.uid?'<button onclick="delPost(\''+p.id+'\')">🗑️ Futa</button>':"")+'</div>').join("");
}
window.likePost=async(id)=>{
  if(!currentUser){ alert("Ingia kwanza!"); return; }
  const ref=doc(db,"posts",id);
  const snap=await getDoc(ref);
  let likes=snap.data().likes||[];
  if(likes.includes(currentUser.uid)) likes=likes.filter(x=>x!==currentUser.uid);
  else likes.push(currentUser.uid);
  await updateDoc(ref,{likes:likes});
};
window.delPost=async(id)=>{ if(confirm("Futa post hii?")) await deleteDoc(doc(db,"posts",id)); };
</script></body></html>
